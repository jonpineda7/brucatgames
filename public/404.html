<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png">
  <title>404 · BruCat Games</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; padding: 12px; display: grid; place-items: center; background: #030314; color: white; font-family: system-ui, sans-serif; }
    main { width: min(100%, 1100px); position: relative; }
    img { display: block; width: 100%; height: auto; border-radius: 20px; }
    a { position: absolute; left: 36.7%; top: 87.8%; width: 24.9%; height: 7.8%; border-radius: 999px; }
    a:hover { box-shadow: 0 0 24px #12deff80; }
    a:focus-visible { outline: 4px solid white; outline-offset: 4px; }
    .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  </style>
</head>
<body>
  <main>
    <h1 class="sr-only">404: Página no encontrada</h1>
    <img src="/images/brucatgames-404.png" alt="Un gorila gamer perdido en el mapa. Página no encontrada." width="1536" height="1024">
    <a href="/" aria-label="Volver al inicio"></a>
  </main>
</body>
</html>
